name: Checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm lint:values
      - run: pnpm build
      - name: Use the runner's installed Chrome for browser checks
        run: echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: pnpm qa
